<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Seema 💖</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffe0f0, #fff5f7);
        font-family: 'Comic Sans MS', cursive;
        text-align: center;
    }

    .container {
        background: white;
        padding: 35px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        max-width: 400px;
        position: relative;
    }

    h1 {
        color: #ff4f8b;
        margin-bottom: 10px;
    }

    p {
        color: #555;
        font-size: 18px;
    }

    img {
        width: 220px;
        border-radius: 20px;
        margin-bottom: 15px;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 20px;
    }
