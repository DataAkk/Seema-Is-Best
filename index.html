<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Seema 💖</title>

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#ffd6e7,#fff5f8);

    font-family:Comic Sans MS,cursive;
}

.container{

    background:white;
    width:90%;
    max-width:420px;

    padding:30px;

    border-radius:25px;

    text-align:center;

    box-shadow:0 10px 25px rgba(0,0,0,0.15);

    position:relative;
}

img{
    width:220px;
    border-radius:20px;
}

h1{
    color:#ff4081;
    margin-top:15px;
}

p{
    color:#555;
    font-size:18px;
    line-height:1.5;
}

.buttons{
    margin-top:25px;
}

button{

    padding:12px 24px;

    margin:10px;

    border:none;

    border-radius:12px;

    font-size:18px;

    cursor:pointer;
}

#yesBtn{
    background:#ff4081;
    color:white;
}

#noBtn{
    background:gray;
    color:white;
    position:absolute;
}

.heart{

    position:fixed;

    font-size:24px;

    animation:float 4s linear infinite;
}

@keyframes float{

    0%{
        transform:translateY(100vh);
        opacity:1;
    }

    100%{
        transform:translateY(-100px);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="container" id="mainBox">

<img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">

<h1>Hey Seema 🧸💖</h1>

<p>
You are seriously awesome ✨<br><br>

Cute smile 😊<br>
Sweet vibes 🌸<br>
And full teddy energy 🧸
</p>

<h2 style="color:#ff4081;">
Will you accept this virtual teddy? 🧸
</h2>

<div class="buttons">

<button id="yesBtn" onclick="celebrate()">
YESSS 💖
</button>

<button id="noBtn" onmouseover="moveButton()">
NO 😶
</button>

</div>

</div>

<script>

const noBtn = document.getElementById("noBtn");

function moveButton(){

    const x =
    Math.random() *
    (window.innerWidth - 120);

    const y =
    Math.random() *
    (window.innerHeight - 80);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

function celebrate(){

document.getElementById("mainBox").innerHTML = `

<img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">

<h1 style="color:#ff4081;">
YAYYY Seema 💖
</h1>

<p style="font-size:20px;">

Sending unlimited teddy hugs 🧸✨<br><br>

Stay happy,<br>
keep smiling,<br>
and never stop being awesome 🌸

</p>

<h2>
Happy Teddy Day 🧸💖
</h2>

`;

createHearts();
}

function createHearts(){

setInterval(() => {

    const heart =
    document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "💖";

    heart.style.left =
    Math.random()*100 + "vw";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    },4000);

},200);

}

</script>

</body>
</html>
